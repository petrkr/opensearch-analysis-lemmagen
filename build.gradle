buildscript {
  ext {
    opensearch_version = "3.7.0"
    lucene_version = "10.4.0"
  }

  repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://plugins.gradle.org/m2/" }
  }

  dependencies {
    classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
  }
}

apply plugin: "java"
apply plugin: "opensearch.opensearchplugin"
apply plugin: "opensearch.pluginzip"
apply plugin: "opensearch.java-agent"

group = "org.opensearch"
version = opensearch_version

base {
  archivesName = "opensearch-analysis-lemmagen"
}

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

repositories {
  mavenLocal()
  mavenCentral()
}

dependencies {
  compileOnly "org.opensearch:opensearch:${opensearch_version}"
  implementation "eu.hlavki.text:jlemmagen:1.0"
  implementation "org.slf4j:slf4j-api:2.0.17"
  testImplementation "org.apache.lucene:lucene-test-framework:${lucene_version}"
  testImplementation("org.opensearch.test:framework:${opensearch_version}") {
    exclude group: "org.hamcrest", module: "hamcrest-all"
    exclude group: "junit", module: "junit"
  }
  testImplementation("junit:junit:4.13.2") {
    exclude group: "org.hamcrest", module: "hamcrest-core"
  }
  testImplementation "org.slf4j:slf4j-simple:2.0.17"
  testImplementation "org.apache.logging.log4j:log4j-core:2.25.3"
  testImplementation "org.apache.logging.log4j:log4j-api:2.25.3"
}

opensearchplugin {
  name "opensearch-analysis-lemmagen"
  description "Lemmatizer token filter"
  classname "org.opensearch.plugin.analysis.lemmagen.AnalysisLemmagenPlugin"
  licenseFile rootProject.file("LICENSE")
  noticeFile rootProject.file("NOTICE.txt")
}

tasks.named("test").configure {
  useJUnit()
  include "**/*Tests.class"
}

loggerUsageCheck.enabled = false
validateNebulaPom.enabled = false
